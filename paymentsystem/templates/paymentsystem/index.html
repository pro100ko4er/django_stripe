<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
</head>
<body>
    <h1>Items</h1>
    <div class="items" style="display: flex; gap: 2px; flex-direction: column;"> 
    {% for item in items %}
  <div class="item" style="border: 2px solid black; padding: 2px;">
    <h3>{{ item.name }}</h3>
    <p>{{ item.description }}</p>
    <a href="/item/{{item.id}}">Go product</a>
  </div>
    {% endfor %}
</div>
<div>
  {% if items.has_previous %}
    <a href="?page={{ items.previous_page_number }}">← Назад</a>
  {% endif %}

  <span>Page {{ items.number }}</span>

  {% if items.has_next %}
    <a href="?page={{ items.next_page_number }}">Вперёд →</a>
  {% endif %}
</div>
</body>
</html>
