version: "3.9"

services:
  backend:
    container_name: django_app

    build:
      context: .
      dockerfile: Dockerfile

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped